services:
  postgres:
    image: postgres:17
    container_name: beauty_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: beauty_shop
      POSTGRES_USER: beauty_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty_user -d beauty_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
